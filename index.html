
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineFind | Hollywood Movies</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f5f6ff;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 15px;background:linear-gradient(135deg,#25164e,#10172d);border-bottom:1px solid #303653}
.logo{font-size:42px;font-weight:900;letter-spacing:-2px}
.logo span{color:#a394ff}
header p{color:#b9bfd5}
.search{display:flex;gap:8px;max-width:700px;margin:20px auto 0}
input,select{padding:13px;border-radius:10px;border:1px solid #3b4260;background:#10182b;color:white;font-size:15px}
input{flex:1;min-width:0}
select{max-width:160px}
main{max-width:1200px;margin:auto;padding:22px 15px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-size:21px}
#count{color:#aeb6d0;font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
.chip{padding:8px 13px;border:1px solid #343c59;border-radius:20px;background:#151d32;color:#e8e9ff;cursor:pointer}
.chip.active,.chip:hover{background:#7765ed;border-color:#7765ed}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}
.card{overflow:hidden;border:1px solid #29334e;border-radius:13px;background:#151d32;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#9484ff}
.poster{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;background:linear-gradient(145deg,var(--a),var(--b));position:relative}
.poster:before{content:"";position:absolute;width:125px;height:125px;border:1px solid #ffffff40;border-radius:50%}
.emoji{font-size:48px;z-index:1}
.poster strong{z-index:1;margin-top:14px;font-size:12px;text-transform:uppercase;letter-spacing:1px;text-shadow:0 2px 5px #000}
.info{padding:12px}
.title{font-size:14px;font-weight:bold;line-height:1.35}
.meta{font-size:12px;color:#aeb6d0;margin-top:7px;display:flex;justify-content:space-between;gap:5px}
.rating{color:#ffd66b}
.tag{display:inline-block;background:#292347;color:#c8bdff;border-radius:5px;padding:4px 6px;font-size:11px;margin-top:9px}
.empty{text-align:center;color:#aeb6d0;padding:40px;grid-column:1/-1}
footer{text-align:center;padding:25px;color:#8993b0;border-top:1px solid #252e48;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modalbox{max-width:430px;width:100%;padding:25px;background:#171f35;border:1px solid #42496a;border-radius:16px}
.close{float:right;background:#393456;color:white;border:0;border-radius:7px;padding:8px 12px;cursor:pointer}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.poster{height:180px}.logo{font-size:36px}.search{flex-wrap:wrap}input{width:100%;flex-basis:100%}select{max-width:none;width:100%}}
</style>
</head>

<p>Discover the best of Hollywood — action, sci-fi, fantasy, thrillers and more.</p>
<div class="search">
<input id="search" type="search" placeholder="Search movies, genres or years...">
<select id="sort">
<option value="featured">Featured</option>
<option value="rating">Top rated</option>
<option value="year">Newest first</option>
<option value="az">A to Z</option>
</select>
</div>
</header>
<main>
<div class="heading"><h2>Hollywood Collection</h2><span id="count"></span></div>
<div class="filters" id="filters"></div>
<div class="grid" id="movies"></div>
</main>
<footer>CineFind • Created by Mayank Sharma • Section AK<br><br>Hollywood movie sample collection. Poster artwork uses stylized emoji cards.</footer>
<div class="modal" id="modal">
<div class="modalbox"><button class="close" onclick="closeModal()">Close ✕</button><div id="details"></div></div>
</div>

const palettes=[["#6c3fba","#17214b"],["#a84343","#281a35"],["#247b91","#16254b"],["#b17a38","#38234c"],["#44855e","#1b3145"],["#a54d81","#2b234c"],["#7d6a9f","#222641"]];
const genres=["All",...new Set(data.map(m=>m[1]))];
let active="All";
const search=document.getElementById("search"),sort=document.getElementById("sort"),grid=document.getElementById("movies"),count=document.getElementById("count");
const filters=document.getElementById("filters");
genres.forEach(g=>{const b=document.createElement("button");b.className="chip"+(g==="All"?" active":"");b.textContent=g;b.onclick=()=>{active=g;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.textContent===g));render()};filters.appendChild(b)});
function render(){
const q=search.value.trim().toLowerCase();
let list=data.filter(m=>(active==="All"||m[1]===active)&&(m[0].toLowerCase().includes(q)||m[1].toLowerCase().includes(q)||String(m[2]).includes(q)));
if(sort.value==="rating")list.sort((a,b)=>b[3]-a[3]);
if(sort.value==="year")list.sort((a,b)=>b[2]-a[2]);
if(sort.value==="az")list.sort((a,b)=>a[0].localeCompare(b[0]));
count.textContent=list.length+" movies";grid.innerHTML="";
if(!list.length){grid.innerHTML='<div class="empty">No movies found. Try another search.</div>';return}
list.forEach((m,i)=>{const p=palettes[i%palettes.length],c=document.createElement("article");c.className="card";
c.innerHTML=`<div class="poster" style="--a:${p[0]};--b:${p[1]}"><span class="emoji">${m[4]}</span><strong>${m[0]}</strong></div><div class="info"><div class="title">${m[0]}</div><div class="meta"><span>${m[2]}</span><span class="rating">★ ${m[3]}</span></div><span class="tag">${m[1]}</span></div>`;
c.onclick=()=>showDetails(m);grid.appendChild(c)});
}
function showDetails(m){document.getElementById("details").innerHTML=`<div style="font-size:52px">${m[4]}</div><h2>${m[0]}</h2><p style="color:#aeb6d0">${m[1]} • ${m[2]}</p><p class="rating">★ ${m[3]} / 10</p><p>This movie is part of the CineFind Hollywood collection.</p>`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
search.addEventListener("input",render);sort.addEventListener("change",render);render();
